version: 2

sources:
  - name: bronze
    description: Raw Olist CSV data loaded without business transformations.
    database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
    schema: "{{ env_var('SNOWFLAKE_BRONZE_SCHEMA', 'BRONZE') }}"
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: raw_customers
        columns:
          - name: customer_id
            data_tests: [not_null, unique]
          - name: customer_unique_id
            data_tests: [not_null]
      - name: raw_geolocation
        columns:
          - name: geolocation_zip_code_prefix
            data_tests: [not_null]
      - name: raw_order_items
        columns:
          - name: order_id
            data_tests: [not_null]
          - name: order_item_id
            data_tests: [not_null]
          - name: product_id
            data_tests: [not_null]
          - name: seller_id
            data_tests: [not_null]
      - name: raw_order_payments
        columns:
          - name: order_id
            data_tests: [not_null]
      - name: raw_order_reviews
        columns:
          - name: review_id
            data_tests: [not_null]
          - name: order_id
            data_tests: [not_null]
      - name: raw_orders
        columns:
          - name: order_id
            data_tests: [not_null, unique]
          - name: customer_id
            data_tests: [not_null]
      - name: raw_products
        columns:
          - name: product_id
            data_tests: [not_null, unique]
      - name: raw_sellers
        columns:
          - name: seller_id
            data_tests: [not_null, unique]
      - name: raw_product_category_translation
        columns:
          - name: product_category_name
            data_tests: [not_null, unique]

